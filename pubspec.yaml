name: git_dependency_prs
description: Link PRs to git dependencies. Generate update timelines and enforce compliance.
version: 0.3.3
homepage: https://github.com/IO-Design-Team/git_dependency_prs

environment:
  sdk: ^3.10.0

dependencies:
  ansicolor: ^2.0.1
  github: ^9.7.0
  pub_api_client: ^3.0.0
  yaml: ^3.1.1
  intl: ^0.20.0
  args: ^2.3.2
  pub_update_checker: ^1.2.0
  analyzer: ^8.0.0
  analyzer_plugin: ^0.13.7
  analysis_server_plugin: ^0.3.3

dev_dependencies:
  rexios_lints: ^17.0.0
  test: ^1.25.7

executables:
  git_dependency_prs: git_dependency_prs
